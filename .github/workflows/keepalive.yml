# Render's free service sleeps after 15 minutes without traffic, and the workers sleep with it.
# This pings /health every 10 minutes. It does nothing until you set the repo variable BACKEND_URL
# (Settings → Secrets and variables → Actions → Variables), e.g. https://abm-aipec-backend.onrender.com
name: keepalive
on:
  schedule: [{ cron: "*/10 * * * *" }]
  workflow_dispatch:

jobs:
  ping:
    if: vars.BACKEND_URL != ''
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 "${{ vars.BACKEND_URL }}/health"
